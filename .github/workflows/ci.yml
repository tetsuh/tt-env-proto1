name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint-and-test:
    name: lint and bats (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            image: ubuntu:22.04
          - distro: ubuntu-24.04
            image: ubuntu:24.04
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install CI tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            gnupg \
            pciutils \
            sudo \
            shellcheck

      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: true

      - name: Create non-root test user
        run: |
          useradd --create-home --shell /bin/bash ci
          chown -R ci:ci "${GITHUB_WORKSPACE}"

      - name: Run lint
        run: su ci -c "cd ${GITHUB_WORKSPACE} && bash scripts/lint.sh"

      - name: Run tests
        run: su ci -c "cd ${GITHUB_WORKSPACE} && bash scripts/test.sh"
